	title = Cargo Winch Boom
	manufacturer = Starship Thingy Mabobs and Such
	description = <#ef7b06>Top node to the winch node on the V3 cargo bay ceiling, then roll it with Q/E until the rails point out of the door. Hoist node to the winch hoist.</color> Open the doors, then slide <b>Target Extension</b> to -4.4 to run the hoist and platform out past the hull. The slider is hidden while the piston is <b>Locked</b>. Lift the deck clear of the bay floor (hoist at -3 or higher) before moving the boom. In action groups, Retract runs it out and Extend brings it in.

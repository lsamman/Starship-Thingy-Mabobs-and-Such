// A node on the V3 cargo bay's ceiling, on the part's axis, for the winch boom.
@PART[SEP_26_SHIP_CARGO]:NEEDS[StarshipExpansionProject]:AFTER[StarshipExpansionProject]
{
	node_stack_winch = 0.0, 3.97, 0.0, 0.0, -1.0, 0.0, 3
}

// SEP's Firefly patch takes every SEP_* part for one of its own and adds a module that looks for a mesh the winch doesn't have: one
// error per part while loading.
@PART[SEP_CW_*]:LAST[StarshipThingyMabobsAndSuch]
{
	!MODULE[ModuleB9DisableTransform] {}
}

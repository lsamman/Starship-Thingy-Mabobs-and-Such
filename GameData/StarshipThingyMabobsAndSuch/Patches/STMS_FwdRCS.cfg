// Forward-facing RCS for the Starship nosecones, cargo and Pez noses and the fairing base: the nozzles point ahead, opposite the engines. A switch in the
// editor, "Forward RCS": off to begin with on SEP's own noses, on with ours. SEP's prototype nose and the HLS crew section already
// have forward nozzles. Models: its/scripts/build_fwdrcs.py. The pods take SEP's steel through B9, never through MODEL's texture =,
// which throws on this shader (no emissive) and loses the part.
@PART[SEP_26_SHIP_NOSECONE|SEP_26_SHIP_CARGO|SEP_26_SHIP_PEZ|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B3
	}
}
@PART[SEP_24_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE_EXP|SEP_24_SHIP_PEZ|SEP_24_SHIP_PEZ_EXP]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B1
	}
}
// Block 1 cargo: outboard of the doors
@PART[SEP_24_SHIP_CARGO|SEP_24_SHIP_CARGO_EXP]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B1C
	}
}
// Block 2: the Block 3 hull, 2.58 m further down
@PART[SEP_25_SHIP_CARGO|SEP_25_SHIP_PEZ]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B3
		position = 0, -2.58, 0
	}
}

@PART[STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|STMS_B3_FairingBase|SEP_26_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE_EXP|SEP_26_SHIP_CARGO|SEP_26_SHIP_PEZ|SEP_25_SHIP_CARGO|SEP_25_SHIP_PEZ|SEP_24_SHIP_CARGO|SEP_24_SHIP_CARGO_EXP|SEP_24_SHIP_PEZ|SEP_24_SHIP_PEZ_EXP]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = STMS_FwdRCS
		thrusterPower = 68
		resourceFlowMode = STAGE_PRIORITY_FLOW
		stagingEnabled = False
		enablePitch = False
		enableYaw = False
		enableRoll = False
		enableX = False
		enableY = False
		enableZ = True
		PROPELLANT
		{
			name = LqdMethane
			ratio = 3
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1
		}
		atmosphereCurve
		{
			key = 0 290
			key = 1 160
			key = 5 0.001
		}
	}
}
@PART[STMS_B3_FairingBase]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	@MODULE[ModuleRCSFX]:HAS[#thrusterTransformName[STMS_FwdRCS]]
	{
		@thrusterPower = 34
	}
}

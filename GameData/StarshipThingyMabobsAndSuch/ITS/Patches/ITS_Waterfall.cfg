// Methalox thruster plumes. Engine plumes come with SEP's engines.
@PART[ITS_Booster|ITS_ShipAft|ITS_Fwd*]:HAS[@MODULE[ModuleRCSFX]]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rcsFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
		}
		TEMPLATE
		{
			templateName = waterfall-rcs-jet-1
			overrideParentTransform = RCSthruster
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 4, 4, 4
		}
	}
}

// A ship made from SEP's Block 3 nosecone and STMS parts. SEP's models and textures come from the player's own install, by path.
// Block 3 tanker: SEP's nosecone with propellant instead of a payload bay. 24000 units (94 t) of room, filled to 31 % (29 t), about what
// the stack lifts; fill it up for a depot.
+PART[SEP_26_SHIP_NOSECONE]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_B3_TankerNose
	@author = Questin, Kari (nosecone); lsamman (kit)
	@title = Block 3 Tanker Nosecone
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 nosecone with our transfer plate on it.</color> Propellant where the payload would be. Goes on SEP's Block 3 core, meets another ship with SEP's docking hardware, and comes home for more. Starts a third full, which is about all the stack can lift: take the rest out of somebody else's rocket.
	@tags = starship sep block3 v3 nose nosecone ship tanker propellant depot refuel transfer methalox
	@mass = 10
	@cost += 4000
	@entryCost += 8000
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_TankerKit
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = Interior_Mesh_10
		transform = Interior_Mesh_7
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Fuel]]
	{
		@baseVolume = 24000
		@SUBTYPE[SEPLMOX]
		{
			percentFilled = 31
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_TankerSteel
		switcherDescription = Plate
		affectDragCubes = false
		SUBTYPE
		{
			name = SEP
			title = SEP steel
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_BASE
				shaderProperty = _MainTex
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _MetalMap
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _AOMap
				transform = stms_tanksteel
			}
		}
	}
}

// Two ships made from SEP's Block 3 sections and STMS parts. SEP's models and textures come from the player's own install, by path.
// HLS Cargo: SEP's cargo section without tiles, flaps or ablative, in white, for the HLS core; with SEP's bay doors and our winch.
// Kits: its/scripts/build_cargokit.py, build_tankerkit.py.
+PART[SEP_26_SHIP_CARGO]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_HLS_Cargo
	@author = Questin, Kari (cargo section); lsamman (kit)
	@title = Starship HLS Cargo Section
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 cargo section in HLS white.</color> Goes on the HLS core instead of the crew section, with nobody aboard to complain about the elevator. Open the doors, put the Cargo Winch on the ceiling node and it sets its load down between the landing legs. Solar panels round the back keep the lights on.
	@tags = starship sep hls moon lunar lander artemis block3 v3 cargo bay delivery uncrewed
	@mass = 8
	@skinMaxTemp = 1700
	@breakingForce = 5000
	@breakingTorque = 5000
	@vesselType = Lander
	!NODE:HAS[#name[node_fin_left]] {}
	!NODE:HAS[#name[node_fin_right]] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]] {}
	!MODULE[MuMechModuleHullCameraZoom]:HAS[#cameraName[NoseCamFlap*]],* {}
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_HLS_CargoKit
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = Tiles
		transform = Ablative 39
		transform = Ablative 43
		transform = Ablative Common
		transform = FWD Aero
		transform = Catch Pin
		transform = raceways
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_White
		switcherDescription = Finish
		affectDragCubes = false
		SUBTYPE
		{
			name = White
			title = HLS white
			primaryColor = #FFFFFF
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/ITS/Parts/stms_plainwhite_diff
				shaderProperty = _MainTex
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/ITS/Parts/stms_plainmask_diff
				shaderProperty = _MetalMap
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/ITS/Parts/stms_plainmask_diff
				shaderProperty = _AOMap
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
		}
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 2000
		maxAmount = 2000
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun0
		raycastTransformName = cargoSun0
		secondaryTransformName = cargoSun0
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun1
		raycastTransformName = cargoSun1
		secondaryTransformName = cargoSun1
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun2
		raycastTransformName = cargoSun2
		secondaryTransformName = cargoSun2
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleLight
		lightName = cargoLight
		useAnimationDim = true
		lightBrightenSpeed = 2.5
		lightDimSpeed = 2.5
		resourceAmount = 0.06
		useResources = true
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = Bay Lights
		shaderProperty = _EmissiveColor
		includedRenderer = cargo_lamps
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleAction = true
		unfocusedRange = 5
		toggleName = Toggle Bay Lights
		eventOnName = Bay Lights: On
		eventOffName = Bay Lights: Off
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.95 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}
}
// Block 3 tanker: SEP's nosecone with propellant instead of a payload bay. 24000 units (94 t) of room, filled to 31 % (29 t), about what
// the stack lifts; fill it up for a depot.
+PART[SEP_26_SHIP_NOSECONE]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_B3_TankerNose
	@author = Questin, Kari (nosecone); lsamman (kit)
	@title = Block 3 Tanker Nosecone
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 nosecone with our transfer plate on it.</color> Propellant where the payload would be. Goes on SEP's Block 3 core, meets another ship with SEP's docking hardware, and comes home for more. Starts a third full, which is about all the stack can lift: take the rest out of somebody else's rocket.
	@tags = starship sep block3 v3 nose nosecone ship tanker propellant depot refuel transfer methalox
	@mass = 10
	@cost += 4000
	@entryCost += 8000
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_TankerKit
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = Interior_Mesh_10
		transform = Interior_Mesh_7
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Fuel]]
	{
		@baseVolume = 24000
		@SUBTYPE[SEPLMOX]
		{
			percentFilled = 31
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_TankerSteel
		switcherDescription = Plate
		affectDragCubes = false
		SUBTYPE
		{
			name = SEP
			title = SEP steel
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_BASE
				shaderProperty = _MainTex
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _MetalMap
				transform = stms_tanksteel
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _AOMap
				transform = stms_tanksteel
			}
		}
	}
}

// the HLS core: its own models carry the cameras and pods
@PART[STMS_HLS_Core]:AFTER[StarshipThingyMabobsAndSuch]
{
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam1
		cameraIDPrefix = ExtCam
		current = 1
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam2
		cameraIDPrefix = ExtCam
		current = 2
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam3
		cameraIDPrefix = ExtCam
		current = 3
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam4
		cameraIDPrefix = ExtCam
		current = 4
		maximum = 8
	}
	MODULE:NEEDS[HullCameraVDS]
	{
		name = MuMechModuleHullCameraZoom
		cameraName = HLSLanding
		cameraTransformName = stms_cam1
		cameraForward = 0, 0, 0
		cameraUp = 0, 0, 0
		cameraPosition = 0.0, 0.0, 0.0
		cameraFoVMax = 100
		cameraFoVMin = 30
	}
	MODULE:NEEDS[HullCameraVDS]
	{
		name = MuMechModuleHullCameraZoom
		cameraName = HLSEngineBay
		cameraTransformName = stms_cam2
		cameraForward = 0, 0, 0
		cameraUp = 0, 0, 0
		cameraPosition = 0.0, 0.0, 0.0
		cameraFoVMax = 90
		cameraFoVMin = 30
	}
	MODULE:NEEDS[HullCameraVDS]
	{
		name = MuMechModuleHullCameraZoom
		cameraName = HLSLeg
		cameraTransformName = stms_cam3
		cameraForward = 0, 0, 0
		cameraUp = 0, 0, 0
		cameraPosition = 0.0, 0.0, 0.0
		cameraFoVMax = 90
		cameraFoVMin = 30
	}
	MODULE:NEEDS[HullCameraVDS]
	{
		name = MuMechModuleHullCameraZoom
		cameraName = HLSDocking
		cameraTransformName = stms_cam4
		cameraForward = 0, 0, 0
		cameraUp = 0, 0, 0
		cameraPosition = 0.0, 0.0, 0.0
		cameraFoVMax = 90
		cameraFoVMin = 30
	}
	MODULE:NEEDS[B9PartSwitch]
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_CamPods
		switcherDescription = Camera pods
		affectDragCubes = false
		SUBTYPE
		{
			name = Shown
			title = Shown
			transform = stms_campods
		}
		SUBTYPE
		{
			name = Hidden
			title = Hidden (the cameras still work)
		}
	}
}

// Hull cameras for RasterPropMonitor (camera pages, the Avionics cockpit's monitors) and Hullcam VDS. Written by its/scripts/make_cameras_cfg.py.
// IDs are fixed across the mod (renumber in the part menu if a ship carries two of a kind):
//   1 aft, down past the engines (HLS: landing)   2 engine bay   3, 4 aft flaps (HLS: a leg, the docking hardware)
//   5, 6 forward flaps (HLS: airlock and elevator, horizon)   7, 8 payload bay, from the door and from above (HLS: hull looking down, nose looking up)
// SEP's ship: SEP's own cameras only (Hullcam keeps SEP's modules). HLS: its own cameras, and a Camera pods switch (hidden, they still work).

// SEP's Block 3 ship core and our expendable copy: SEP's engine bay and aft flap cameras
@PART[SEP_26_SHIP_CORE|STMS_B3_CoreExp]:NEEDS[RasterPropMonitor]:AFTER[StarshipThingyMabobsAndSuch]
{
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = UpperAftCameraTransform_1
		cameraIDPrefix = ExtCam
		current = 1
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = LowerAftCameraTransform_1
		cameraIDPrefix = ExtCam
		current = 2
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = Cam_LAft
		cameraIDPrefix = ExtCam
		current = 3
		maximum = 8
	}
	MODULE:NEEDS[RasterPropMonitor]
	{
		name = JSIExternalCameraSelector
		cameraContainer = Cam_RAft
		cameraIDPrefix = ExtCam
		current = 4
		maximum = 8
	}
}

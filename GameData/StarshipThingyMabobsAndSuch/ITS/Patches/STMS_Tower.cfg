// Staging plays a copy of the arm's clip, the way ModularLaunchPads' arms do it.
@PART[STMS_QDArm]:NEEDS[StagedAnimation]
{
	MODULE
	{
		name = ModuleStagedAnimation
		staged = true
		animationName = qdArmStage
		waitForAnimation = false
		layer = 1
	}
}
@PART[STMS_CrewArm]:NEEDS[StagedAnimation]
{
	MODULE
	{
		name = ModuleStagedAnimation
		staged = true
		animationName = crewArmStage
		waitForAnimation = false
		layer = 1
	}
}

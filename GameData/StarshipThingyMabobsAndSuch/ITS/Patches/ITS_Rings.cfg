// The rings burn many engines at once, so they get a cut-down copy of SEP's Raptor 3 plume: five effects per engine
// instead of eighteen.
+EFFECTTEMPLATE:HAS[#templateName[Raptor3]]:NEEDS[StarshipExpansionProject,Waterfall]:AFTER[StarshipExpansionProject]
{
	@templateName = ITS_Raptor3Lite
	!EFFECT:HAS[#name[M0]] {}
	!EFFECT:HAS[#name[M1-2]] {}
	!EFFECT:HAS[#name[M2]] {}
	!EFFECT:HAS[#name[M3-2]] {}
	!EFFECT:HAS[#name[M4-2]] {}
	!EFFECT:HAS[#name[M5-2]] {}
	!EFFECT:HAS[#name[M5-3]] {}
	!EFFECT:HAS[#name[M5-4]] {}
	!EFFECT:HAS[#name[MFO_SL2]] {}
	!EFFECT:HAS[#name[MFO_LIGHT_SL+Vac]] {}
	!EFFECT:HAS[#name[MFO_Vac]] {}
	!EFFECT:HAS[#name[MI1]] {}
	!EFFECT:HAS[#name[MI2]] {}
}
@PART[ITS_Ring21|ITS_Ring14|ITS_Ring7]:NEEDS[StarshipExpansionProject,Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX],*
	{
		@TEMPLATE:HAS[#templateName[Raptor3]]
		{
			@templateName = ITS_Raptor3Lite
		}
	}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[plumeSwitch]] {}
	!MODULE[ModuleSEPPartSwitchAction] {}
}


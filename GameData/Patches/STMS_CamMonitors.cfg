// Camera monitors for the Avionics cockpit, so the pilots can see along the ship, which no window does: copies of ASET's ALCOR 40x20
// MFD (made here at load from the player's ASET Props; none of its files are shipped) that start on a camera page.
// Landing: ALCOR's landing page (altitude, vertical speed) over the hull cameras (STMS_Cameras.cfg): landing, aft flaps or leg, hull, engine bay.
+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor,ASET]:FOR[StarshipThingyMabobsAndSuch]
{
	@name = STMS_CamMFD_Landing
	MODEL
	{
		model = ASET/ASET_Props/MFDs/ALCORMFD40x20/ALCORMFD40X20
	}
	@MODULE[RasterPropMonitor]
	{
		@PAGE[pALCORSTBY40x20]
		{
			!default = DEL
		}
		@PAGE[pALCORLanding40x20]
		{
			default = yes
			@BACKGROUNDHANDLER[JSISteerableCamera]
			{
				@cameraTransform = ExtCam1|ExtCam3|ExtCam4|ExtCam7|ExtCam2
				@fovLimits = 90,15|90,15|90,15|90,15|90,15
				@zoomRate = 10|10|10|10|10
				@yawLimits = -45,45|-45,45|-45,45|-45,45|-45,45
				@yawRate = 15|15|15|15|15
				@pitchLimits = -45,45|-45,45|-45,45|-45,45|-45,45
				@pitchRate = 15|15|15|15|15
			}
		}
	}
}
// Docking: ALCOR's docking page, the camera of the docking port you control from (Control From Here on the port).
+PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor,ASET]:FOR[StarshipThingyMabobsAndSuch]
{
	@name = STMS_CamMFD_Docking
	MODEL
	{
		model = ASET/ASET_Props/MFDs/ALCORMFD40x20/ALCORMFD40X20
	}
	@MODULE[RasterPropMonitor]
	{
		@PAGE[pALCORSTBY40x20]
		{
			!default = DEL
		}
		@PAGE[pALCORDocking40x20]
		{
			default = yes
		}
	}
}

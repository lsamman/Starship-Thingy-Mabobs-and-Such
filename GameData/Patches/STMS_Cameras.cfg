// Hull cameras for RasterPropMonitor's camera pages and the Avionics cockpit's camera monitors, after the ship views of SpaceX's flight
// livestreams. IDs are fixed across the mod (renumber in the part menu if a ship carries two of a kind):
//   1 landing (down the hull past the engines or legs)   2 engine bay   3, 4 aft flaps (HLS: a leg, the docking hardware)
//   5, 6 forward flaps (HLS: airlock and elevator, horizon)   7 hull looking aft (cargo and Pez noses: the payload bay)   8 nose looking forward
// Camera pods: Shown or Hidden on the outside; hidden, the cameras still work. On SEP's parts the pods come with RasterPropMonitor;
// the flap cameras sit in SEP's own camera housings.

// SEP's Block 3 ship core and our expendable copy of it
@PART[SEP_26_SHIP_CORE|STMS_B3_CoreExp]:NEEDS[RasterPropMonitor,B9PartSwitch]:AFTER[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/Assets/STMS_Cams_B3Core
	}
	MODULE
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam1
		cameraIDPrefix = ExtCam
		current = 1
		maximum = 8
	}
	MODULE
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam2
		cameraIDPrefix = ExtCam
		current = 2
		maximum = 8
	}
	MODULE
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam3
		cameraIDPrefix = ExtCam
		current = 3
		maximum = 8
	}
	MODULE
	{
		name = JSIExternalCameraSelector
		cameraContainer = stms_cam4
		cameraIDPrefix = ExtCam
		current = 4
		maximum = 8
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_CamPods
		switcherDescription = Camera pods
		affectDragCubes = false
		SUBTYPE
		{
			name = Shown
			title = Shown
			transform = stms_campods
		}
		SUBTYPE
		{
			name = Hidden
			title = Hidden (the cameras still work)
		}
	}
}
// SEP's nosecone and our two crew noses: forward flaps, the hull looking aft, the nose looking forward
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo]:NEEDS[RasterPropMonitor,B9PartSwitch]:AFTER[StarshipThingyMabobsAndSuch]

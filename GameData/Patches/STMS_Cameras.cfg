// The nose camera (8) sits on the step of SEP's extended ablative strip: its housing takes the ablative with the strip.
// SEP's Ablative switch shows one of its two copies; the pods switch above still hides both (they hang under stms_campods).
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|SEP_26_SHIP_CARGO|SEP_26_SHIP_PEZ]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]]]:NEEDS[RasterPropMonitor,B9PartSwitch]:AFTER[StarshipThingyMabobsAndSuch]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]]
	{
		@SUBTYPE:HAS[#name[39]]
		{
			transform = stms_campods_bare
		}
		@SUBTYPE:HAS[#name[43]]
		{
			transform = stms_campods_abl
		}
	}
}
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|SEP_26_SHIP_CARGO|SEP_26_SHIP_PEZ]:HAS[!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]]]:NEEDS[RasterPropMonitor,B9PartSwitch]:AFTER[StarshipThingyMabobsAndSuch]
{
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = stms_campods_abl
	}
}

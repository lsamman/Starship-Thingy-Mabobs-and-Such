// Block 3 Cargo Section (Awning Door): SEP's Block 3 cargo section with the HLS awning section's bay, door and ramp in SEP's door
// opening. SEP's model comes from the player's own install; ours (its/scripts/derive_b3cargo.py) carries the bay and, cut from SEP's
// clamshell doors, the awning door's skin. SEP's doors, bay interior, floor and colliders are switched off; its header tank, flaps,
// tiles, Ablative switch, RCS and cameras stay.
+PART[SEP_26_SHIP_CARGO]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_B3_CargoAwning
	@author = Questin, Kari (cargo section); lsamman (bay and door)
	@title = Block 3 Cargo Section (Awning Door)
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 cargo section with the HLS cargo bay inside.</color> SEP's clamshells make way for one door that swings up like an awning over the bay, and a ramp that folds out over the sill. Put the Crane Frame on the node by the sill and the Cargo Winch Hoist under its crossbar (or set Boom mount to Beams and use the Boom), open the door, run it out, and it sets its load down beside the hull. The Cargo Floors stack more loads above the first.
	@tags = starship sep block3 v3 cargo bay awning door ramp crane delivery
	@mass += 1.0
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/Assets/STMS_B3_CargoAwning
	}
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/Assets/STMS_HLS_CargoKit
	}
	!NODE:HAS[#name[node_cargo]] {}
	!node_stack_winch = DEL
	node_stack_cargo = 0, -2.8, 0, 0, 1, 0, 4
	node_stack_winch = 0, 2.24, 0, 0, -1, 0, 3
	node_stack_crane = 0, -2.8, -1.72, 0, 1, 0, 2
	node_stack_floor1 = 0, -2.8, 1, 0, 1, 0, 2
	node_stack_floor2 = 0, -2.8, 0.3, 0, 1, 0, 2
	// the cargo bay finds its door by module index, so SEP's door animation (first module) drives ours in place
	@MODULE[ModuleAnimateGeneric]:HAS[#animationName[CargoDoor]]
	{
		@animationName = stmsAwning
	}
	@MODULE[ModuleCargoBay]
	{
		@nodeInnerAft = cargo
		%lookupRadius = 3.6
		%lookupCenter = 0, 0.8, 0
	}
	!MODULE[MuMechModuleHullCameraZoom]:HAS[#cameraName[Payload_2]] {}      // it looked down the bay from above, now the top bulkhead's
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = DoorL
		transform = DoorR
		transform = Cylinder
		transform = Cargo_Double_Hinges
		transform = Interior_Mesh_10
		transform = Interior_Mesh_7
		transform = Payload Adapter
		transform = .Colliders
		transform = cargo_sill
		transform = cargo_panel0
		transform = cargo_panel1
		transform = cargo_panel2
		transform = cargo_panelframe0
		transform = cargo_panelframe1
		transform = cargo_panelframe2
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = rampOut
		actionGUIName = Toggle Ramp
		startEventGUIName = Put Ramp Out
		endEventGUIName = Fold Ramp In
		defaultActionGroup = None
		allowDeployLimit = false
		evaDistance = 6
	}
	MODULE
	{
		name = ModuleLight
		lightName = cargoLight
		useAnimationDim = true
		lightBrightenSpeed = 2.5
		lightDimSpeed = 2.5
		resourceAmount = 0.06
		useResources = true
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = Bay Lights
		shaderProperty = _EmissiveColor
		includedRenderer = cargo_lamps
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleAction = true
		unfocusedRange = 5
		toggleName = Toggle Bay Lights
		eventOnName = Bay Lights: On
		eventOffName = Bay Lights: Off
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.95 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = HLS_WinchMount
		switcherDescription = Boom mount
		affectDragCubes = false
		affectFARVoxels = false
		SUBTYPE
		{
			name = None
			title = None
			primaryColor = gray
		}
		SUBTYPE
		{
			name = Beams
			title = Beams (for the winch boom)
			primaryColor = white
			transform = winchmount
		}
	}
	MODULE
	{
		name = ModuleSTMSDoorGuard
		animationName = stmsAwning
		guardNode = crane
		outLimit = -0.15
	}
	// the cut pieces carry stand-in textures; B9 gives them SEP's own, from SEP's folder
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_Hull
		switcherDescription = Hull
		affectDragCubes = false
		SUBTYPE
		{
			name = SEP
			title = SEP steel
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_11_BASE
				shaderProperty = _MainTex
				transform = stms_b3barrel
				transform = stms_b3doorsill
				transform = stms_b3doorbarrelL
				transform = stms_b3doorbarrelR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_11_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_b3barrel
				transform = stms_b3doorsill
				transform = stms_b3doorbarrelL
				transform = stms_b3doorbarrelR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_11_MASK
				shaderProperty = _MetalMap
				transform = stms_b3barrel
				transform = stms_b3doorsill
				transform = stms_b3doorbarrelL
				transform = stms_b3doorbarrelR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_11_MASK
				shaderProperty = _AOMap
				transform = stms_b3barrel
				transform = stms_b3doorsill
				transform = stms_b3doorbarrelL
				transform = stms_b3doorbarrelR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_BASE
				shaderProperty = _MainTex
				transform = stms_b3doorogiveL
				transform = stms_b3doorogiveR
				transform = stms_b3noseupL
				transform = stms_b3noseupR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_b3doorogiveL
				transform = stms_b3doorogiveR
				transform = stms_b3noseupL
				transform = stms_b3noseupR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _MetalMap
				transform = stms_b3doorogiveL
				transform = stms_b3doorogiveR
				transform = stms_b3noseupL
				transform = stms_b3noseupR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
				shaderProperty = _AOMap
				transform = stms_b3doorogiveL
				transform = stms_b3doorogiveR
				transform = stms_b3noseupL
				transform = stms_b3noseupR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_TILES_BASE
				shaderProperty = _MainTex
				transform = stms_b3doortilesL
				transform = stms_b3doortilesR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_TILES_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_b3doortilesL
				transform = stms_b3doortilesR
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_BASE
				shaderProperty = _MainTex
				transform = stms_b3pin
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_b3pin
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _MetalMap
				transform = stms_b3pin
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _AOMap
				transform = stms_b3pin
			}
		}
	}
}

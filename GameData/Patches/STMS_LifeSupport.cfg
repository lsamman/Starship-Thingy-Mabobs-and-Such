	{
		name = Food
		amount = 900
		maxAmount = 900
	}
	RESOURCE
	{
		name = Water
		amount = 600
		maxAmount = 600
	}
	RESOURCE
	{
		name = Oxygen
		amount = 92000
		maxAmount = 92000
	}
}

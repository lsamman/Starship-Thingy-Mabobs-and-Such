// Life support supplies for the crew cabins, at the ITS crew section's rate per kerbal (ITS_Mods.cfg), unless the part has them already
// (the Block 3 noses are copies of SEP's, which other patches may have supplied). Kerbalism equips crewed parts itself.
@PART[STMS_HLS_Crew]:HAS[!RESOURCE[Food]]:NEEDS[TacLifeSupport]:AFTER[StarshipThingyMabobsAndSuch]
{
	RESOURCE
	{
		name = Food
		amount = 450
		maxAmount = 450
	}
	RESOURCE
	{
		name = Water
		amount = 300
		maxAmount = 300
	}
	RESOURCE
	{
		name = Oxygen
		amount = 46000
		maxAmount = 46000
	}
}

// ASET's props ask for the Arial font, which RasterPropMonitor does not ship, so RPM asks the system for it. Under Proton (and on any
// system without Arial) the font it gets back draws garbled labels. RPM ships LiberationSans, made to Arial's metrics: use that.
// This applies to every ASET prop in the install (ALCOR's too), not only ours.
@PROP[*]:HAS[@MODULE[*]:HAS[#fontName[Arial]]]:NEEDS[RasterPropMonitor,ASET]:FINAL
{
	@MODULE[*],*:HAS[#fontName[Arial]]
	{
		@fontName = LiberationSans-Regular
	}
}

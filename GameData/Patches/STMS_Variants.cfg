// The original HLS cargo section: SEP's Block 3 cargo section without tiles, flaps or ablative, in white, with SEP's bay doors. SEP's models and
// textures come from the player's own install, by path. Kit: its/scripts/build_cargokit.py.
+PART[SEP_26_SHIP_CARGO]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_HLS_Cargo
	@author = Questin, Kari (cargo section); lsamman (kit)
	@title = Starship HLS Cargo Section (Bay Doors)
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 cargo section in HLS white.</color> Goes on the HLS core instead of the crew section, with nobody aboard to complain about the elevator. Open the doors, put the Cargo Winch on the ceiling node and it sets its load down between the landing legs. Solar panels round the back keep the lights on.
	@tags = starship sep hls moon lunar lander artemis block3 v3 cargo bay delivery uncrewed
	@mass = 8
	@skinMaxTemp = 1700
	@breakingForce = 5000
	@breakingTorque = 5000
	@vesselType = Lander
	!NODE:HAS[#name[node_fin_left]] {}
	!NODE:HAS[#name[node_fin_right]] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]] {}
	!MODULE[MuMechModuleHullCameraZoom]:HAS[#cameraName[NoseCamFlap*]],* {}
	// the HLS has no header tank: SEP's integrated one and its boil-off module go
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Fuel]] {}
	!MODULE[ModuleCryoTank],* {}
	!RESOURCE[LqdMethane],* {}
	!RESOURCE[Oxidizer],* {}
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/Assets/STMS_HLS_CargoKit
	}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = Tiles
		transform = Ablative 39
		transform = Ablative 43
		transform = Ablative Common
		transform = FWD Aero
		transform = Catch Pin
		transform = raceways
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_White
		switcherDescription = Finish
		affectDragCubes = false
		SUBTYPE
		{
			name = White
			title = HLS white
			primaryColor = #FFFFFF
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Assets/stms_plainwhite_diff
				shaderProperty = _MainTex
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Assets/stms_plainmask_diff
				shaderProperty = _MetalMap
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Assets/stms_plainmask_diff
				shaderProperty = _AOMap
				transform = Nose_7_EXT
				transform = Cylinder
				transform = Hatch
				transform = Vent
				transform = RCS hole
				transform = Cargo_Double_Hinges
				transform = WeldLines
				transform = doubler thingy
				transform = Cam_EXT
				transform = Cam_INT
			}
		}
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 2000
		maxAmount = 2000
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun0
		raycastTransformName = cargoSun0
		secondaryTransformName = cargoSun0
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun1
		raycastTransformName = cargoSun1
		secondaryTransformName = cargoSun1
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		pivotName = cargoSun2
		raycastTransformName = cargoSun2
		secondaryTransformName = cargoSun2
		isBreakable = false
		sunAlignFactor = 1
		resourceName = ElectricCharge
		chargeRate = 5
		showStatus = true
	}
	MODULE
	{
		name = ModuleLight
		lightName = cargoLight
		useAnimationDim = true
		lightBrightenSpeed = 2.5
		lightDimSpeed = 2.5
		resourceAmount = 0.06
		useResources = true
	}
	MODULE
	{
		name = ModuleColorChanger
		moduleID = Bay Lights
		shaderProperty = _EmissiveColor
		includedRenderer = cargo_lamps
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleAction = true
		unfocusedRange = 5
		toggleName = Toggle Bay Lights
		eventOnName = Bay Lights: On
		eventOffName = Bay Lights: Off
		defaultActionGroup = Light
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.95 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}
}

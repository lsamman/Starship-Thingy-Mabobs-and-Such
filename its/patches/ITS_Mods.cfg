// Optional support for other mods.
@PART[ITS_FwdCrew]:NEEDS[ConnectedLivingSpace]
{
	%MODULE[ModuleConnectedLivingSpace]
	{
		passable = true
	}
}
@PART[ITS_FwdCargo|ITS_FwdTanker|ITS_ShipAft|ITS_Booster]:NEEDS[ConnectedLivingSpace]
{
	%MODULE[ModuleConnectedLivingSpace]
	{
		passable = false
	}
}
@PART[ITS_Booster|ITS_ShipAft|ITS_FwdCrew|ITS_FwdCargo|ITS_FwdTanker|ITS_Ring*|ITS_RVac]:NEEDS[CommunityTechTree]:LAST[StarshipThingyMabobsAndSuch]
{
	@TechRequired = colossalRocketry
}
@PART[ITS_FwdCrew]:NEEDS[TacLifeSupport]
{
	RESOURCE
	{
		name = Food
		amount = 900
		maxAmount = 900
	}
	RESOURCE
	{
		name = Water
		amount = 600
		maxAmount = 600
	}
	RESOURCE
	{
		name = Oxygen
		amount = 92000
		maxAmount = 92000
	}
}
@PART[ITS_FwdCrew]:NEEDS[Snacks]
{
	RESOURCE
	{
		name = Snacks
		amount = 4800
		maxAmount = 4800
	}
}
@PART[ITS_FwdCrew]:NEEDS[USILifeSupport]
{
	RESOURCE
	{
		name = Supplies
		amount = 12000
		maxAmount = 12000
	}
}
// The parts sit in SEP's category, beside the engines they use.
@CUSTOM_PARTLIST_CATEGORY:HAS[#categoryName[Starship?Expansion?Project]]:NEEDS[StarshipExpansionProject]:AFTER[StarshipExpansionProject]
{
	SUBCATEGORY
	{
		categoryName = ITS 2016
		icon = StarshipExpansionProject/Categories/SEP
		PARTS
		{
			part = ITS.Booster
			part = ITS.Ring21
			part = ITS.Ring14
			part = ITS.Ring7
			part = ITS.GridFin
			part = ITS.ShipAft
			part = ITS.FwdCrew
			part = ITS.FwdCargo
			part = ITS.FwdTanker
			part = ITS.RVac
			part = ITS.Leg
			part = ITS.FanArray
			part = ITS.CargoBoom
			part = ITS.CargoHoist
			part = ITS.CargoPlatform
		}
	}
	SUBCATEGORY
	{
		categoryName = V3 Thingy Mabobs
		icon = StarshipExpansionProject/Categories/SEP
		PARTS
		{
			part = SEP.CW.Boom
			part = SEP.CW.Hoist
			part = SEP.CW.Platform
		}
	}
}

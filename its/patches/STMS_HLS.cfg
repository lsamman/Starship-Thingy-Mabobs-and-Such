// Plumes for the HLS: the RCS gets the same small methalox jets as the ITS parts, the landing ring gets vernier plumes.
@PART[STMS_HLS_Core]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!MODEL_MULTI_PARTICLE {}
		}
		@landing
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = landingFX
		engineID = landing
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = landing
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = -1
			maximum = 1
			speed = 20
			seed = -1
		}
		TEMPLATE
		{
			templateName = waterfall-methalox-vernier-1
			overrideParentTransform = landingThrust
			position = 0,0,0
			rotation = 0,0,0
			scale = 2.7, 2.7, 2.0
		}
	}
}
@PART[STMS_HLS_Crew|STMS_HLS_CargoAwning|STMS_B3_Depot]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
}
@PART[STMS_HLS_Core|STMS_HLS_Crew|STMS_HLS_CargoAwning|STMS_B3_Depot]:NEEDS[Waterfall]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = rcsFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = RCSthruster
		}
		TEMPLATE
		{
			templateName = waterfall-rcs-jet-1
			overrideParentTransform = RCSthruster
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 2.5, 2.5, 2.5
		}
	}
}
// The depot keeps its methane cold: a tenth of the boiloff of SEP's tanks, and the coolers start switched on.
@PART[STMS_B3_Depot]:NEEDS[CryoTanks]
{
	MODULE
	{
		name = ModuleCryoTank
		CoolingEnabled = True
		BOILOFFCONFIG
		{
			FuelName = LqdMethane
			BoiloffRate = 0.0005
			CoolingCost = 0.02
		}
	}
}

// Community Category Kit: one "Starship Thingy Mabobs" button under Filter by Function, holding every part of this mod.
// Parts are named one by one because ITS_* could match other mods. A new part needs adding here (tools/check_cck.py checks).
@CCKExtraFilterConfig:NEEDS[CommunityCategoryKit]
{
	Item
	{
		name = Starship Thingy Mabobs
		tag = cck-stms
		normalIcon = StarshipThingyMabobsAndSuch/Icons/STMS_N
		selectedIcon = StarshipThingyMabobsAndSuch/Icons/STMS_S
		usedByMod = Starship Thingy Mabobs and Such
	}
}
// after the copies of SEP's parts (engine rings, crew nosecones) exist
@PART[STMS_HLS_Core|STMS_HLS_Crew|STMS_HLS_Leg|STMS_HLS_Lift|STMS_HLS_Solar|STMS_HLS_LegShroud|STMS_HLS_Docking_M|STMS_HLS_Docking_F|STMS_Ship_Leg|STMS_OLIT_Core|STMS_CrewArm|STMS_QDArm|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|SEP_CW_Boom|SEP_CW_Hoist|SEP_CW_Platform|ITS_Booster|ITS_ShipAft|ITS_FwdCrew|ITS_FwdCargo|ITS_FwdTanker|ITS_Leg|ITS_FanArray|ITS_GridFin|ITS_CargoBoom|ITS_CargoHoist|ITS_CargoPlatform|ITS_Ring21|ITS_Ring14|ITS_Ring7|ITS_RVac]:HAS[#tags[*]]:NEEDS[CommunityCategoryKit]:LAST[StarshipThingyMabobsAndSuch]
{
	@tags ^= :$: cck-stms:
}

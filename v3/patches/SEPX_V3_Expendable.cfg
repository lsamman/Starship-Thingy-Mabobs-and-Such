// Adds an Expendable config to the V3 upper stage body, using the same kind of B9 switch SEP uses for its own options.
// Mass: SEP's V1 expendable body drops 1 t for 187.42 m2 of tiles and aerocovers, measured from its model (5.336 kg/m2).
// V3 drops 220.60 m2 at that rate: tiles 181.26, ablative strip 24.73, aerocover steel and flap pipes 14.61. That is 1.18 t.
// The saving sits in the part's base mass and the Reusable config adds it back, so existing craft keep 25 t.
@PART[SEP_26_SHIP_CORE]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@mass = 23.82

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = SEPX_Recovery
		switcherDescription = Recovery Hardware
		affectDragCubes = false

		SUBTYPE
		{
			name = Reusable
			title = Reusable
			descriptionDetail = Heat shield tiles, ablative strip, aerocovers and flap mounts.
			primaryColor = #202020
			secondaryColor = #808080
			addedMass = 1.18
			transform = NewTiles
			transform = .Ablative Common
			transform = .Aerocovers
			node = node_fin_left
			node = node_fin_right
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_5_MASK
				shaderProperty = _MetalMap
				transform = Cylinder1
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_5_MASK
				shaderProperty = _AOMap
				transform = Cylinder1
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_4_MASK
				shaderProperty = _MetalMap
				transform = Rings_4
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_4_MASK
				shaderProperty = _AOMap
				transform = Rings_4
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_3_MASK
				shaderProperty = _MetalMap
				transform = Rings_3
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_3_MASK
				shaderProperty = _AOMap
				transform = Rings_3
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _MetalMap
				transform = Rings_1
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _AOMap
				transform = Rings_1
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _MetalMap
				transform = WeldLines
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _AOMap
				transform = WeldLines
			}
		}

		SUBTYPE
		{
			name = Expendable
			title = Expendable
			descriptionDetail = Bare steel all round. No tiles, no flaps, and it will not survive re-entry.
			primaryColor = #C8C8CC
			secondaryColor = #808080
			transform = stms_racewaycap
			skinMaxTemp = 1700
			// SEP's own switches own these two meshes, so they get shrunk away inside the tank, as its V1 body does with engine shields
			TRANSFORM
			{
				name = TestTiles
				scaleOffset = 0.01
			}
			TRANSFORM
			{
				name = .Ablative 43
				scaleOffset = 0.01
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_5_MASK_BARE
				shaderProperty = _MetalMap
				transform = Cylinder1
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_5_MASK_BARE
				shaderProperty = _AOMap
				transform = Cylinder1
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_4_MASK_BARE
				shaderProperty = _MetalMap
				transform = Rings_4
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_4_MASK_BARE
				shaderProperty = _AOMap
				transform = Rings_4
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_3_MASK_BARE
				shaderProperty = _MetalMap
				transform = Rings_3
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_3_MASK_BARE
				shaderProperty = _AOMap
				transform = Rings_3
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_1_MASK_BARE
				shaderProperty = _MetalMap
				transform = Rings_1
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_1_MASK_BARE
				shaderProperty = _AOMap
				transform = Rings_1
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_1_MASK_BARE
				shaderProperty = _MetalMap
				transform = WeldLines
			}
			TEXTURE
			{
				texture = StarshipThingyMabobsAndSuch/Textures/SEP_B3_Ship_Core_1_MASK_BARE
				shaderProperty = _AOMap
				transform = WeldLines
			}
		}
	}
}

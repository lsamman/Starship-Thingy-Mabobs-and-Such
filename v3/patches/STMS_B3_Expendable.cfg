// The expendable Block 3 core as a part of its own: SEP's model from the player's install without tiles, ablative strip,
// aerocovers and flap nodes, in bare-steel masks. (The switch on SEP's own core stays, for craft that use it.)
+PART[SEP_26_SHIP_CORE]:NEEDS[StarshipExpansionProject,B9PartSwitch,!RealismOverhaul]:AFTER[StarshipExpansionProject]
{
	@name = STMS_B3_CoreExp
	@author = Questin, Kari
	@title = Block 3 Expendable Core
	@manufacturer = Starship Thingy Mabobs and Such
	@description = <#ef7b06>Needs SEP: this is its Block 3 ship core, stripped.</color> Bare steel all round: no tiles, no flaps, and no plan to come back. Takes the Payload Plate and Fairing, or any of SEP's noses.
	@tags = starship sep block3 v3 expendable core tank methalox upper stage
	@mass = 23.82
	@skinMaxTemp = 1700
	// SEP models the external stringer rows on the leeward half only (the tiles hid the rest); our copy, built from the
	// player's SEP by v3/scripts/derive_stringers.py, closes them round the windward side. It carries grey stand-ins;
	// the Bare subtype below gives it SEP's own textures, as the crew noses' cut pieces get theirs.
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_B3_Stringers
	}
	!NODE:HAS[#name[node_fin_left]] {}
	!NODE:HAS[#name[node_fin_right]] {}
	!node_stack_stmsleg1 = DEL
	!node_stack_stmsleg2 = DEL
	!node_stack_stmsleg3 = DEL
	!node_stack_stmsleg4 = DEL
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEPX_Recovery]] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Tiles]] {}
	!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Ablative]] {}
	MODULE
	{
		name = ModuleB9DisableTransform
		transform = NewTiles
		transform = TestTiles
		transform = .Ablative Common
		transform = .Ablative 43
		transform = .Aerocovers
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = STMS_Bare
		switcherDescription = Hull
		affectDragCubes = false
		SUBTYPE
		{
			name = Bare
			title = Bare steel
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_BASE
				shaderProperty = _MainTex
				transform = stms_stringers
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_NRM
				shaderProperty = _BumpMap
				isNormalMap = true
				transform = stms_stringers
			}
			TEXTURE
			{
				texture = StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_1_MASK
				shaderProperty = _MetalMap
				transform = stms_stringers
			}
			TEXTURE
			{

// Forward-facing RCS on the Starship nosecones: the nozzles point ahead, opposite the engines, for backing away and slowing down.
// SEP's prototype nose and the HLS crew section already have forward nozzles. Models: its/scripts/build_fwdrcs.py.
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B3
		texture = stms_steel_diff, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_BASE
		texture = stms_steel_nrm, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_NRM
		texture = stms_steelmask_diff, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
	}
}
@PART[SEP_24_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE_EXP]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODEL
	{
		model = StarshipThingyMabobsAndSuch/ITS/Parts/STMS_FwdRCS_B1
		texture = stms_steel_diff, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_BASE
		texture = stms_steel_nrm, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_NRM
		texture = stms_steelmask_diff, StarshipExpansionProject/Assets/BL3/SEP_B3_Ship_Core_7_MASK
	}
}
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|SEP_24_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE_EXP]:NEEDS[StarshipExpansionProject]:LAST[StarshipThingyMabobsAndSuch]
{
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = STMS_FwdRCS
		thrusterPower = 68
		resourceFlowMode = STAGE_PRIORITY_FLOW
		stagingEnabled = False
		enablePitch = False
		enableYaw = False
		enableRoll = False
		enableX = False
		enableY = False
		enableZ = True
		PROPELLANT
		{
			name = LqdMethane
			ratio = 3
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1
		}
		atmosphereCurve
		{
			key = 0 290
			key = 1 160
			key = 5 0.001
		}
	}
}
@PART[SEP_26_SHIP_NOSECONE|STMS_B3_NoseCrew|STMS_B3_NoseCrewCargo|SEP_24_SHIP_NOSECONE|SEP_24_SHIP_NOSECONE_EXP]:NEEDS[StarshipExpansionProject,Waterfall]:LAST[StarshipThingyMabobsAndSuch]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = stmsFwdRcsFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			thrusterTransformName = STMS_FwdRCS
		}
		TEMPLATE
		{
			templateName = FossilRCS
			overrideParentTransform = STMS_FwdRCS
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 1.2, 4, 1.2
		}
	}
}
